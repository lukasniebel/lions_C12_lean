      framework: "Claude Code"
      tool_setup: >-
        The Lean code, the blueprint and the documentation were written by AI coding agents
        (Anthropic's Claude models, run through Claude Code) under the direction of the author, who
        supplied the paper. The list of models is given from memory and may be incomplete.
      cost:
