# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4: provenance, sources, process and review of this formalisation.
version: "v0.4"

project:
  name: "Lions' maximal regularity problem for divergence-form differential operators: failure at the 1/2-Hölder endpoint"
  description: >-
    A Lean 4 formalisation, built on mathlib, of L. Niebel, "Lions' Maximal Regularity Problem for
    Divergence-Form Differential Operators: Failure at the 1/2-Hölder Endpoint"
    (arXiv:2608.11194v2), an arXiv preprint. J.-L. Lions asked whether the variational solution of
    u' + A(t)u = f, u(0) = 0, with forms of bounded measurable coefficients, has maximal
    L^2-regularity, u' in L^2(0,T;H), when f is in L^2(0,T;H). The paper shows that 1/2-Hölder
    continuity in time with values in L^infinity does not suffice: on the interval (0,pi) it
    constructs a bounded, uniformly elliptic, real scalar coefficient, 1/2-Hölder continuous in time
    with values in L^infinity(0,pi) and arbitrarily close to 1, a continuous L^2-valued forcing, and
    the unique Lions variational solution, whose time derivative is not square integrable (Theorem
    1.1); and, by zero extension, tensorisation and parabolic rescaling, real symmetric isotropic
    counterexamples on R^d and on every bounded domain of R^d, d >= 1 (Corollary 1.2). The compared
    theorems are Theorem 1.1 and Corollary 1.2, stated in Challenge.lean in the paper's spaces H =
    L^2, V = H^1_0 (the closure of the graphs of C^1_c functions) and V' (its anti-dual), with
    uniqueness of the Lions solution. The repository formalises, in its own terms and with every
    deviation recorded in DEVIATIONS.md, the other numbered statements of the paper, one of them in
    part (Corollary 7.1 directly, without the cited sufficiency theorems and the operator-theoretic
    side conditions), with no counterpart for Remark 3.1 (a comment without a claim), and proves
    Lions' uniqueness theorem in the paper's complex spaces; about 21,000 lines of Lean in 61
    library modules; every theorem of the library depends only on the standard axioms propext,
    Classical.choice and Quot.sound, and there is no sorry outside the two deliberate ones in
    Challenge.lean.
  authors:
    - "Lukas Niebel"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lukas Niebel"

