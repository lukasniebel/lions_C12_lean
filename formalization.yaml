related_formalizations: []

status:
  scope: >-
    The compared theorems, LionsC12Challenge.lions_counterexample_interval and
    LionsC12Challenge.lions_counterexample_domain (Challenge.lean, proved in Solution.lean), are
    Theorem 1.1 and Corollary 1.2 of the paper in mathlib's terms: the coefficient is measurable,
    bounded and uniformly elliptic, with the C^{0,1/2}([0,1];L^infinity) bounds summing to less than
    delta and no C^{0,alpha} bound for 1/2 < alpha < 1; the forcing is real, continuous on [0,1]
    into L^2 and square integrable; the solution is real, continuous into H^1_0, differentiable
    within [0,1] into H^{-1} with continuous derivative, Bochner integrable in L^2 with an
    integrable distributional derivative, vanishes at 0, satisfies the equation in H^{-1} for every
    t in [0,1], is a Lions variational solution, and every Lions solution with the same forcing
    equals it almost everywhere; no square-integrable L^2-valued function represents its derivative,
    and (on the interval) u(t) lies in the domain of the H-realisation for every t, with the
    elliptic part in L^1 but not in L^2. The library proves in addition, in its own terms: Lemma
    2.1, Propositions 3.2 to 3.4 (with D(A_{0,H}) identified with the intersection of H^2 and
    H^1_0), Lemma 4.1, Proposition 5.1, the remark on the growth of the maximal-regularity constant
    (the truncated problems have maximal regularity, and every constant is at least c eps sqrt(log
    N)), Lemma 6.1, Propositions 6.2 and 6.3, Corollary 7.1 (directly, without the cited sufficiency
    theorems), Corollary 1.2 on every non-empty open set, and Lions' theorem on real Gelfand
    triples. Not formalised: Remark 3.1, the sufficiency theorems cited in Section 7 and the
    operator-theoretic part of the side conditions of Achache-Ouhabaz; the proofs of Theorem 1.1 and
    Corollary 1.2 depend on none of them.
  # Excluding the two deliberate sorries of Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

