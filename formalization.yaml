  spend_usd: "subscription-based"
  notes: >-
    The author supplied the paper and directed the work; AI coding agents wrote the Lean code, the
    blueprint and the documentation. Lean checks the proofs against the formal statements, and
    Comparator checks that Solution.lean proves the statements of Challenge.lean with the axioms
    propext, Quot.sound and Classical.choice only. The correspondence between the formal statements
    and the paper is documented in CORRESPONDENCE.md and DEVIATIONS.md.

fidelity:
  divergences: >-
    Differences between the compared theorems and Theorem 1.1 and Corollary 1.2 as printed (in full:
    DEVIATIONS.md, Parts A and B). (1) H^1_0 is the closure of the graphs of C^1_c functions in L^2
    x L^2 with the graph norm, H^{-1} its anti-dual: equivalent to the usual definitions, which are
    not formalised. (2) C^1([0,1];V') is a derivative within [0,1] at every point with a continuous
    derivative; W^{1,1}(0,1;H) is Bochner integrability with an integrable distributional derivative
    tested against real C_c^infinity(0,1) functions. (3) The Lions class is: w in L^2(0,1;V), a
    V'-valued distributional derivative in L^2(0,1;V'), the equation almost everywhere, and a
    V'-continuous representative vanishing at 0. (4) The negative clauses do not depend on a
    representative: no L^2(0,1;H) function represents u' almost everywhere, and every representative
    of A(t)u(t) is in L^1 but not in L^2. (5) The C^{0,1/2} norm is the sum of the two suprema, read
    as two non-negative bounds A + B < delta. (6) Real-valuedness of an L^2 element is the vanishing
    of its imaginary part almost everywhere. (7) On a domain, "bounded domain" is a bounded
    non-empty open set (connectedness is dropped, and neither boundedness nor connectedness is
    used), the matrix norm is the operator norm of R^d, and symmetry is IsSelfAdjoint.

review:
  status: "author-verified"
  reviewers:
    - "Lukas Niebel"
  notes: >-
    Lean checks each proof against its formal statement. The author reviewed that the statements are
    the intended theorems. Each public statement was compared with the paper by independent model
    reviews, and the comparator declaration is checked mechanically. This is not external peer
    review.

alignment:
  namespace: "LionsC12Challenge"
  statements:
    - source: "Theorem 1.1 (thm:main)"
      lean: "LionsC12Challenge.lions_counterexample_interval"
      module: "Solution"
      status: "proved"
      note: >-
        The compared theorem; its statement is that of Challenge.lean, with the differences from the
        printed theorem listed under fidelity.divergences.
    - source: "Corollary 1.2 (cor:bounded-domains)"
      lean: "LionsC12Challenge.lions_counterexample_domain"
      module: "Solution"
      status: "proved"
      note: "The compared theorem; differences under fidelity.divergences."
    - source: "Corollary 1.2 (cor:bounded-domains), on every non-empty open set"
      lean: "LionsC12.lions_counterexample_open"
      module: "LionsC12.Domains.Corollary"
      status: "proved"
      note: "DEVIATIONS.md, B5."
    - source: "Propositions 6.2 and 6.3 (prop:line, prop:tensor)"
      lean: "LionsC12.lions_counterexample_fullspace"
      module: "LionsC12.Domains.Corollary"
      status: "proved"
      note: "With every clause of Corollary 1.2 on R^d; DEVIATIONS.md, C6.2."
    - source: "Corollary 7.1"
      lean: "LionsC12.endpoint_hypotheses_fail"
      module: "LionsC12.Endpoint.Main"
      status: "proved"
      note: "Proved directly, without the cited theorems; DEVIATIONS.md, C7.1-C7.8."
    - source: "Remark 5.2 (growth of the maximal-regularity constant)"
      lean: "LionsC12.truncation_maxReg_growth"
      module: "LionsC12.Interval.MaxReg"
      status: "proved"
      note: >-
        The truncated problems have maximal regularity with a finite constant, and every constant is
        at least c eps sqrt(log N), with explicit constants; DEVIATIONS.md, C5.2.

